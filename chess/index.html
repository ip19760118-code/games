function checkEndOnline(){
  const mv=genLegal(turn);
  if(mv.length===0){
    if(inCheck(turn)){
      const winnerSide = turn==='w' ? 'b' : 'w';   // мат стороне turn => победил противоположный
      endGame(winnerSide,'checkmate');
    } else {
      endGame(null,'stalemate');
    }
    return true;
  }
  if(halfmove>=100){endGame(null,'fifty');return true;}
  if(insufficient()){endGame(null,'material');return true;}
  return false;

  roomRef.child('rematch/'+mySideOnline).set(true);
  endOverlay.classList.remove('show');
  showStatus('🔄 Ожидание соперника для реванша…');
  const rm=(roomDataCache&&roomDataCache.rematch)||{};
  if(rm[otherSide()]){
    const newRound=(roomDataCache.round||1)+1;
    if(myRound!==newRound){
      console.log('[CH] opponent already agreed -> reset round to',newRound);
      roomRef.child('moves').remove();
      roomRef.update({round:newRound,rematch:{w:false,b:false},flags:{drawOffer:null,drawAccept:false,surrender:null,winner:null},status:'playing'});
    }
  }
}
const $=id=>document.getElementById(id);
const boardEl=$('board'),statusEl=$('status');
const settingsModal=$('settingsModal'),endOverlay=$('endOverlay'),promoOverlay=$('promoOverlay'),modeOverlay=$('modeOverlay');
let sqEls=[];
(function buildBoard(){for(let v=0;v<64;v++){const d=document.createElement('div');d.className='sq';d.addEventListener('click',()=>onSquare(+d.dataset.i));boardEl.appendChild(d);sqEls.push(d);}})();
const flipped=()=>playerSide==='b';
function orientIdx(vr,vc){return flipped()?(7-vr)*8+(7-vc):vr*8+vc;}
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){if(!sqEls||!sqEls.length)return;const chkSq=inCheck(turn)?kingSq(turn):-1;
 for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){const idx=orientIdx(vr,vc);const el=sqEls[vr*8+vc];el.dataset.i=idx;
  let cls='sq '+(((idx>>3)+(idx&7))%2===0?'light':'dark');
  if(idx===sel)cls+=' sel';if(lastMove&&(idx===lastMove.from||idx===lastMove.to))cls+=' last';if(idx===chkSq)cls+=' chk';
  if(sel!=null&&legalCache.some(m=>m.from===sel&&m.to===idx))cls+=board[idx]?' capT':' tgt';
  el.className=cls;el.innerHTML='';const p=board[idx];
  if(p){const s=document.createElement('span');s.className='pc '+p.c;s.textContent=glyphOf(p);el.appendChild(s);}}
 let byP='',byA='';for(const m of moveLog){if(m.captured){if(m.piece.c===playerSide)byP+=glyphOf(m.captured);else byA+=glyphOf(m.captured);}}
 $('capByPlayer').textContent=byP;$('capByAI').textContent=byA;
 $('undoBtn').disabled=onlineMode||!(moveLog.length>=2&&turn===playerSide&&!thinking&&!gameOver);}
function showStatus(t,w){statusEl.textContent=t;statusEl.classList.toggle('warn',!!w);}
function onSquare(idx){ensureAudio();if(gameOver||promoPending||fieldViewMode)return;
 if(onlineMode){if(thinking||turn!==mySideOnline)return;
  if(sel!=null){const c=legalCache.filter(m=>m.from===sel&&m.to===idx);if(c.length){if(c[0].promo){openPromo(c);return;}doPlayerMoveOnline(c[0]);return;}}
  const p=board[idx];if(p&&p.c===mySideOnline){sel=idx;legalCache=genLegal(mySideOnline);sClick();}else sel=-1;render();}
 else{if(thinking||turn!==playerSide)return;
  if(sel!=null){const c=legalCache.filter(m=>m.from===sel&&m.to===idx);if(c.length){if(c[0].promo){openPromo(c);return;}doPlayerMove(c[0]);return;}}
  const p=board[idx];if(p&&p.c===playerSide){sel=idx;legalCache=genLegal(playerSide);sClick();}else sel=-1;render();}}
function doPlayerMove(m){sel=-1;legalCache=[];const wc=!!m.captured;makeMove(m);wc?sCap():sMove();Platform.haptic('light');render();if(inCheck(turn)){sCheck();showStatus('⚠️ Шах компьютеру!',true);}if(checkEnd())return;aiTurn();}
function doPlayerMoveOnline(m){sel=-1;legalCache=[];const wc=!!m.captured;makeMove(m);wc?sCap():sMove();Platform.haptic('light');render();sendMoveOnline(m);if(inCheck(turn)){sCheck();showStatus('⚠️ Шах сопернику!',true);}else updateOnlineStatus();checkEndOnline();}
function aiTurn(){thinking=true;showStatus('🤔 Компьютер думает...');setTimeout(()=>{const m=aiBestMove();thinking=false;if(!m){checkEnd();return;}const wc=!!m.captured;makeMove(m);wc?sCap():sMove();render();if(inCheck(turn)){sCheck();showStatus('⚠️ Шах вам!',true);}else showStatus('Ваш ход');checkEnd();},120);}
function undoMove(){if(onlineMode)return;if(moveLog.length<2||turn!==playerSide||thinking||gameOver)return;unmakeMove();unmakeMove();sel=-1;legalCache=[];sClick();render();showStatus('Ваш ход');}
function showFieldView(){endOverlay.classList.remove('show');fieldViewMode=true;$('fieldViewBar').classList.add('show');}
function closeFieldView(){fieldViewMode=false;$('fieldViewBar').classList.remove('show');if(gameOver){endOverlay.classList.add('show');}}
function endGame(winner,reason){if(gameOver)return;gameOver=true;thinking=false;
 const R={checkmate:'Мат',stalemate:'Пат — ничья',fifty:'Ничья (50 ходов)',material:'Ничья (мало фигур)',draw_agreed:'Ничья по соглашению',surrender:'Соперник сдался',flag:'Партия окончена'};
 let title,sub;
 if(onlineMode){
  if(winner===mySideOnline){title='🏆 Победа!';sub=R[reason]||'';matchScore[mySideOnline]=(matchScore[mySideOnline]||0)+1;sWin();Platform.haptic('success');
   if(reason!=='flag'){try{const upd={'flags/winner':mySideOnline,status:'finished'};upd['scores/'+mySideOnline]=matchScore[mySideOnline];roomRef.update(upd);}catch(e){}}}
  else if(winner===null){title='🤝 Ничья';sub=R[reason]||'';sDraw();
   if(reason!=='flag'){try{roomRef.update({'flags/winner':'draw',status:'finished'});}catch(e){}}}
  else{title='💀 Поражение';sub=R[reason]||'';matchScore[winner]=(matchScore[winner]||0)+1;sLose();Platform.haptic('error');
   if(reason!=='flag'){try{const upd={'flags/winner':winner,status:'finished'};upd['scores/'+winner]=matchScore[winner];roomRef.update(upd);}catch(e){}}}
 }else{
  if(winner==='player'){title='🏆 Победа!';sub=R[reason];stats.w++;sWin();Platform.haptic('success');}
  else if(winner==='computer'){title='💀 Поражение';sub=R[reason];stats.l++;sLose();Platform.haptic('error');}
  else{title='🤝 Ничья';sub=R[reason];stats.d++;sDraw();}
  saveStats();displayStats();}
 trackEvent('game_end',{game_name:'chess',mode:onlineMode?'online':'ai',difficulty:set.diff,side:playerSide,winner:winner||'draw',reason:reason,moves:moveLog.length});
 $('endTitle').textContent=title;$('endSub').textContent=sub+' · ходов: '+Math.ceil(moveLog.length/2);
 const b=$('endBtns');b.innerHTML='';
 if(onlineMode){b.innerHTML='<button class="btn primary" id="eR">🔄 Реванш</button><button class="btn" id="eV">👁 Посмотреть партию</button><button class="btn" id="eS">📤 Поделиться</button><button class="btn" id="eL">🚪 Выйти</button><button class="btn" id="eH">🏠 В меню</button>';
  $('eR').onclick=requestRematch;$('eV').onclick=showFieldView;$('eS').onclick=shareGame;
  $('eL').onclick=()=>{leaveRoom();resetBoard();endOverlay.classList.remove('show');modeOverlay.classList.add('show');};
  $('eH').onclick=()=>{leaveRoom();goToHub();};}
 else{b.innerHTML='<button class="btn primary" id="eN">🔄 Ещё партию</button><button class="btn" id="eV">👁 Посмотреть партию</button><button class="btn" id="eS">📤 Поделиться</button><button class="btn" id="eH">🏠 В меню</button>';
  $('eN').onclick=()=>{sClick();resetGameAI();};$('eV').onclick=showFieldView;$('eS').onclick=shareGame;$('eH').onclick=goToHub;}
 endOverlay.classList.add('show');showStatus(title+' '+sub);render();updateRoomActions();renderPlayersBar();}
function shareGame(){const t=$('endTitle').textContent;Platform.share(location.href,'♟️ Шахматы: '+t+' '+$('endSub').textContent+'. Сыграй!');trackEvent('game_share',{game_name:'chess'});}
/* оффлайн: семантика 'player'/'computer' (не меняется) */
function checkEnd(){const mv=genLegal(turn);if(mv.length===0){if(inCheck(turn))endGame(turn===playerSide?'computer':'player','checkmate');else endGame(null,'stalemate');return true;}if(halfmove>=100){endGame(null,'fifty');return true;}if(insufficient()){endGame(null,'material');return true;}return false;}
function openPromo(cands){promoPending=cands;const row=$('promoRow');row.innerHTML='';const side=onlineMode?mySideOnline:playerSide;
 for(const pr of['Q','R','B','N']){const b=document.createElement('button');b.className='promo-btn';const s=document.createElement('span');s.className='pc '+side;s.textContent=(side==='w'?GLYPH_W:GLYPH_B)[pr];b.appendChild(s);
  b.addEventListener('click',()=>{const m=cands.find(x=>x.promo===pr);hidePromo();if(m){onlineMode?doPlayerMoveOnline(m):doPlayerMove(m);}});row.appendChild(b);}
 promoOverlay.classList.add('show');}
function hidePromo(){promoPending=null;promoOverlay.classList.remove('show');}
function cancelPromo(){hidePromo();sel=-1;render();}
$('promoCancel').onclick=cancelPromo;
function resetGameAI(){onlineMode=false;stopHeartbeat();if(roomRef){roomRef.off();roomRef=null;}roomCode=null;mySideOnline=null;roomDataCache=null;myRound=0;
 $('roomBar').style.display='none';$('roomBar').classList.remove('open');$('rbExtra').style.display='none';
 playerSide=set.side;aiSide=playerSide==='w'?'b':'w';resetBoard();render();showStatus('Ваш ход');
 trackEvent('game_start',{game_name:'chess',difficulty:set.diff,side:playerSide});if(turn!==playerSide)aiTurn();}
$('newBtn').onclick=()=>{ensureAudio();sClick();if(onlineMode){if(gameOver)requestRematch();else if(confirm('Прервать и предложить реванш?'))requestRematch();}else resetGameAI();};
$('undoBtn').onclick=()=>{ensureAudio();undoMove();};
$('hubBtn').onclick=()=>{if(onlineMode)leaveRoom();goToHub();};
$('modeHubBtn').onclick=goToHub;
$('closeFieldView').onclick=closeFieldView;
$('rbToggle').onclick=()=>{const bar=$('roomBar'),ex=$('rbExtra');const open=ex.style.display!=='none';ex.style.display=open?'none':'flex';bar.classList.toggle('open',!open);sClick();};
$('settingsBtn').onclick=()=>{ensureAudio();sClick();displayStats();settingsModal.classList.add('show');};
$('closeSettingsBtn').onclick=()=>settingsModal.classList.remove('show');
settingsModal.addEventListener('click',e=>{if(e.target===settingsModal)settingsModal.classList.remove('show');});
$('resetStatsBtn').onclick=()=>{if(confirm('Сбросить статистику?')){stats={w:0,l:0,d:0};saveStats();displayStats();}};
function displayStats(){$('stW').textContent=stats.w;$('stL').textContent=stats.l;$('stD').textContent=stats.d;}
function applyTheme(){const colors={classic:'#101418',green:'#20301c',neon:'#14162a'};
 if(set.theme==='classic')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',set.theme);
 try{Platform.colors(colors[set.theme]||'#101418');}catch(e){}}
$('diffSelect').onchange=e=>{set.diff=e.target.value;saveSet();trackEvent('settings_change',{game_name:'chess',setting:'difficulty',value:set.diff});};
$('sideSelect').onchange=e=>{set.side=e.target.value;saveSet();trackEvent('settings_change',{game_name:'chess',setting:'side',value:set.side});if(!onlineMode)showStatus('Сторона применится в новой игре');};
$('themeSelect').onchange=e=>{set.theme=e.target.value;saveSet();applyTheme();trackEvent('settings_change',{game_name:'chess',setting:'theme',value:set.theme});};
$('volSlider').oninput=e=>{set.vol=e.target.value/100;$('volV').textContent=e.target.value+'%';saveSet();if(MASTER)MASTER.gain.value=set.vol;};
$('modeAi').onclick=()=>{ensureAudio();sClick();modeOverlay.classList.remove('show');resetGameAI();};
$('modeHost').onclick=async()=>{ensureAudio();sClick();await createRoom();};
$('modeJoin').onclick=()=>{$('joinCodeBox').style.display='flex';$('joinCodeActions').style.display='flex';$('joinCodeInput').value='';$('joinCodeInput').focus();};
$('joinCancel').onclick=()=>{$('joinCodeBox').style.display='none';$('joinCodeActions').style.display='none';};
$('joinGo').onclick=async()=>{const c=$('joinCodeInput').value.trim().toUpperCase();if(c.length!==6){alert('Введи 6 символов');return;}await joinRoom(c);};
(function loadSettings(){$('diffSelect').value=set.diff;$('sideSelect').value=set.side;$('themeSelect').value=set.theme;
 $('volSlider').value=Math.round(set.vol*100);$('volV').textContent=Math.round(set.vol*100)+'%';applyTheme();displayStats();
 $('verTag').textContent='v'+VER;$('verTag2').textContent='v'+VER;})();
(function initStart(){try{board=initialBoard();render();
 const u=new URL(location.href);const urlRoom=u.searchParams.get('room');
 if(urlRoom&&urlRoom.length===6)joinRoom(urlRoom);else modeOverlay.classList.add('show');
 }catch(e){console.error('init error:',e);modeOverlay.classList.add('show');}})();
window.addEventListener('beforeunload',()=>{stopHeartbeat();removePresence();});
</script>
