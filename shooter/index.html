<html lang="ru">

<head>

    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            cursor: none;
            background: #000;
            touch-action: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .ui-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 6px 12px;
            color: white;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: clamp(12px, 4vw, 20px);
            white-space: nowrap;
        }

        #score-panel { top: 10px; left: 10px; }
        #enemy-panel { top: 10px; right: 10px; }
        #wave-panel { top: 60px; right: 10px; }
        #timer-panel { top: 60px; left: 10px; background: rgba(0, 0, 0, 0.6); color: #88ffaa; }
        #combo-panel { top: 110px; left: 10px; font-size: clamp(12px, 4vw, 18px); }

        #weapon-panel {
            bottom: 160px;
            left: 10px;
            width: auto;
            max-width: 260px;
            font-size: clamp(12px, 3.5vw, 16px);
            background: rgba(0, 0, 0, 0.75);
            pointer-events: auto;
            white-space: normal;
        }

        .weapon-switcher {
            position: absolute;
            bottom: 90px;
            left: 10px;
            display: flex;
            gap: 8px;
            z-index: 150;
        }

        .weapon-switch-btn {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            color: white;
            font-family: monospace;
            font-size: clamp(11px, 3.2vw, 14px);
            font-weight: 600;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 62px;
            text-align: center;
            line-height: 1.1;
        }

        .weapon-switch-btn .w-icon { font-size: 20px; }

        .weapon-switch-btn .w-name {
            font-size: clamp(9px, 2.6vw, 11px);
            opacity: 0.85;
        }

        .weapon-switch-btn.active {
            background: rgba(255, 51, 102, 0.3);
            border-color: #ff3366;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
        }

        .weapon-switch-btn:active { transform: scale(0.95); }

        .weapon-switch-btn.empty { opacity: 0.45; }

        #record-panel { bottom: 10px; left: 10px; font-size: clamp(10px, 3vw, 14px); }

        #achievement-toast {
            position: absolute;
            bottom: 100px;
            right: 10px;
            left: 10px;
            background: gold;
            color: black;
            padding: 8px;
            border-radius: 30px;
            font-weight: bold;
            transition: opacity 0.5s;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            text-align: center;
            font-size: clamp(12px, 4vw, 16px);
        }

        #floating-text {
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translateX(-50%);
            color: gold;
            font-size: clamp(18px, 6vw, 28px);
            font-weight: bold;
            text-shadow: 0 0 8px red, 0 0 2px black;
            pointer-events: none;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s, transform 0.5s;
            text-align: center;
            max-width: 80vw;
            font-family: monospace;
            white-space: normal;
        }

        #floating-text.show { opacity: 1; }

        #floating-text.warn {
            color: #ff4466;
            text-shadow: 0 0 8px #ff0044, 0 0 2px black;
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f2a, #0a0a1a);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            font-family: monospace;
            backdrop-filter: blur(10px);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .menu-card {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            border: 2px solid #ff66aa;
            box-shadow: 0 0 50px rgba(255, 102, 170, 0.5);
            width: 85%;
            max-width: 350px;
        }

        .menu-card h1 {
            font-size: clamp(28px, 8vw, 48px);
            margin: 0 0 15px;
            background: linear-gradient(45deg, #ffaa44, #ff44cc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .menu-ver {
            font-size: 10px;
            opacity: 0.45;
            font-family: monospace;
            letter-spacing: 1px;
            margin-top: 12px;
        }

        .mode-selector { margin: 15px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .mode-btn {
            background: #333;
            border: 2px solid #ff66aa;
            padding: 8px 12px;
            border-radius: 40px;
            cursor: pointer;
            color: white;
            font-family: monospace;
            transition: 0.2s;
            font-size: clamp(12px, 4vw, 16px);
            flex: 1;
            text-align: center;
        }

        .mode-btn.selected { background: #ff66aa; border-color: white; }

        .menu-card button {
            background: #ff3366;
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 8px;
            border-radius: 40px;
            font-size: clamp(16px, 5vw, 20px);
            cursor: pointer;
            transition: 0.2s;
            font-family: monospace;
        }

        .menu-card button:hover { background: #ff66aa; transform: scale(1.02); }

        .slider-container { margin: 15px 0; text-align: left; color: white; }
        .slider-container label { display: block; margin-bottom: 5px; font-size: clamp(12px, 4vw, 14px); }
        input[type="range"] { width: 100%; cursor: pointer; background: #ff66aa; height: 4px; border-radius: 5px; }

        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(50px, 15vw, 80px);
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px #ff66aa;
            z-index: 400;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 60px;
            font-family: monospace;
            pointer-events: none;
            display: none;
            white-space: nowrap;
        }

        #game-over-screen,
        #pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            font-family: monospace;
            color: white;
            backdrop-filter: blur(5px);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #game-over-screen.hidden,
        #pause-screen.hidden { display: none; }

        #game-over-screen p,
        #pause-screen p { font-size: clamp(16px, 5vw, 24px); margin: 10px; }

        #game-over-screen button,
        #pause-screen button {
            background: #ff3366;
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 40px;
            font-size: clamp(16px, 5vw, 18px);
            cursor: pointer;
            font-family: monospace;
        }

        .btn-hub {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: monospace;
            margin-bottom: 14px;
            transition: all 0.15s;
            letter-spacing: 0.5px;
        }
        .btn-hub:hover { background: rgba(255, 255, 255, 0.08); border-color: #fff; }
        .btn-hub:active { transform: scale(0.96); }

        .crosshair-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }

        .action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 250;
        }

        .mobile-action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            font-family: monospace;
        }

        .mobile-shoot-btn {
            background: rgba(255, 51, 102, 0.9);
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
        }

        .mobile-pause-btn {
            background: rgba(0, 0, 0, 0.8);
            font-size: 24px;
        }

        @media (min-width: 768px) {
            .action-buttons { bottom: 20px; right: 20px; gap: 12px; }
            .mobile-action-btn { width: 50px; height: 50px; font-size: 24px; }
            .mobile-pause-btn { font-size: 20px; }
        }

        #crosshair {
            position: absolute;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            z-index: 200;
            pointer-events: none;
            transition: transform 0.05s;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            box-shadow: 0 0 4px currentColor;
            border-radius: 2px;
        }

        #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
        #crosshair::after { top: 0; left: 50%; width: 2px; height: 100%; transform: translateX(-50%); }

        .ammo-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .ammo-fill { height: 100%; background: linear-gradient(90deg, #44ff44, #88ff88); transition: width 0.2s; }
        .weapon-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

        @media (max-width: 480px) {
            .ui-panel { padding: 4px 8px; }
            #weapon-panel { bottom: 150px; max-width: 220px; }
            .weapon-switcher { bottom: 85px; }
            .weapon-switch-btn { min-width: 56px; padding: 8px 10px; }
            .action-buttons { bottom: 20px; right: 20px; gap: 12px; }
            .mobile-action-btn { width: 55px; height: 55px; font-size: 24px; }
        }

        .customize-color {
            margin-top: 15px;
            color: #fff;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>

<body>
    <div id="score-panel" class="ui-panel">🎯 СЧЕТ: <span id="scoreValue">0</span></div>
    <div id="enemy-panel" class="ui-panel">👾 ВРАГОВ: <span id="enemyCount">0</span></div>

        </div>
        <div class="weapon-switch-btn" data-weapon="1">
            <span class="w-icon">⚡</span>
            <span class="w-name">Автомат</span>
        </div>
        <div class="weapon-switch-btn" data-weapon="2">
            <span class="w-icon">💥</span>
            <span class="w-name">Дробовик</span>
        </div>

    <div id="record-panel" class="ui-panel">🏆 РЕКОРД: <span id="recordValue">0</span></div>

    <div id="countdown">3</div>

    <div id="floating-text"></div>

    <div id="menu-screen">
        <div class="menu-card">
            <button class="btn-hub" id="hubBtnMenu">← В меню игр</button>
            <h1>✨ 3D SHOOTER ✨</h1>
            <div class="mode-selector">
                <div id="modeEndless" class="mode-btn selected">♾️ Бесконечный<br>(до патронов)</div>

            </div>

                <label>🎵 Музыка: <span id="musicVolLabel">50%</span></label>

        <button class="btn-hub" id="hubBtnGameOver">← В меню игр</button>

        <p id="gameOverReason"></p>
        <p>Ваш счет: <span id="finalScore">0</span></p>

            <button id="restartBtn">🔄 ИГРАТЬ СНОВА</button>

        <button class="btn-hub" id="hubBtnPause">← В меню игр</button>

        <button id="resumeBtn">ПРОДОЛЖИТЬ</button>
        <button id="quitBtn">🚪 ЗАКОНЧИТЬ ИГРУ</button>
        <div class="customize-color">
            <span>🎨 Цвет прицела:</span>
            <input type="color" id="crosshairColor" value="#ff66ff">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const VER = '1.1';

        /* ========== ЕДИНЫЙ СЛОЙ ПЛАТФОРМ (TG / VK / MAX / web) ========== */
        /* v1.1: BackButton-логика перенесена в callback back.
           Platform сам определит платформу и навесит обработчик. */
        function backButtonHandler() {
            try {
                const menuScreen = document.getElementById('menu-screen');
                const gameOverScreen = document.getElementById('game-over-screen');
                const pauseScreen = document.getElementById('pause-screen');

                if (menuScreen.style.display !== 'none') { goToHub(); return; }
                if (!gameOverScreen.classList.contains('hidden')) { resetGameToMenu(); return; }
                if (!pauseScreen.classList.contains('hidden')) { paused = false; pauseScreen.classList.add('hidden'); return; }
                if (gameActive && !paused) { paused = true; pauseScreen.classList.remove('hidden'); return; }
                goToHub();
            } catch (e) { goToHub(); }
        }

        Platform.init({
            bg: '#050b1a',
            back: backButtonHandler
        });

        /* v1.1: возвращаемся в хаб, сохраняя платформу */
        function goToHub() {
            Platform.haptic('light');
            location.href = '../?plat=' + Platform.name;
        }

        /* v1.1: трекер с автоматической меткой платформы */
        function trackEvent(name, params) {
            params = params || {};
            params.platform = Platform.name;
            try {
                if (typeof gtag === 'function') {
                    gtag('event', name, params);
                }
            } catch (e) {}
        }

        /* v1.1: событие открытия игры с source=платформа */
        (function trackGameOpen() {
            try {
                const key = 'shooter_session_tracked';
                if (!sessionStorage.getItem(key)) {
                    sessionStorage.setItem(key, '1');
                    trackEvent('game_open', {
                        game_name: 'shooter',
                        source: Platform.name,
                        ver: VER
                    });
                }
            } catch (e) {}
        })();

        // ------------------- АУДИО -------------------
        let audioCtx = null;
        let musicGain = null;
        let sfxGain = null;
        let musicInterval = null;
        let musicEnabled = false;
        let musicVolume = 0.5;
        let sfxVolume = 0.7;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            musicGain = audioCtx.createGain();
            sfxGain = audioCtx.createGain();
            musicGain.connect(audioCtx.destination);
            sfxGain.connect(audioCtx.destination);
            musicGain.gain.value = musicVolume;
            sfxGain.gain.value = sfxVolume;
        }

        /* v1.1: все tgHaptic заменены на Platform.haptic */
        function playSound(type) {
            if (!audioCtx || !sfxGain) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(sfxGain);
            if (type === 'shot') {
                osc.frequency.value = 800;
                gain.gain.value = 0.2;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
                Platform.haptic('light');
            } else if (type === 'hit') {
                osc.frequency.value = 1200;
                gain.gain.value = 0.25;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
                osc.start(); osc.stop(now + 0.1);
                Platform.haptic('success');
            } else if (type === 'miss') {
                osc.frequency.value = 400;
                gain.gain.value = 0.1;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
                osc.start(); osc.stop(now + 0.15);
            } else if (type === 'bonus') {
                osc.frequency.value = 1800;
                gain.gain.value = 0.2;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
                Platform.haptic('success');
            } else if (type === 'reload') {
                osc.frequency.value = 600;
                gain.gain.value = 0.15;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
                Platform.haptic('light');
            } else if (type === 'switch') {
                osc.frequency.value = 1000;
                gain.gain.value = 0.15;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                osc.start(); osc.stop(now + 0.08);
                Platform.haptic('light');
            } else if (type === 'empty') {
                osc.frequency.value = 200;
                gain.gain.value = 0.15;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
                osc.start(); osc.stop(now + 0.15);
                Platform.haptic('warning');
            }
        }

        function startMusic() {
            if (musicInterval) clearInterval(musicInterval);
            if (!audioCtx || !musicGain) return;
            let note = 0;
            musicInterval = setInterval(() => {
                if (!gameActive || paused || !musicEnabled || !audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(musicGain);
                const notes = [261.63, 293.66, 329.63, 349.23];
                osc.frequency.value = notes[note % notes.length];
                gain.gain.value = 0.08;
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
                osc.start(); osc.stop(now + 0.2);
                note++;
            }, 500);
        }

        function stopMusic() {
            if (musicInterval) clearInterval(musicInterval);
            musicInterval = null;
        }

        // ------------------- НАСТРОЙКИ ИГРЫ -------------------
        let gameActive = false;
        let paused = false;
        let gameMode = 'endless';
        let timeLeft = 60;
        let timerInterval = null;
        let score = 0;
        let wave = 1;
        let combo = 1;
        let comboCounter = 0;
        let enemiesKilled = 0;
        let highScore = localStorage.getItem('shooterHighScore') || 0;
        document.getElementById('recordValue').innerText = highScore;

            showFloatingText('🔫 ' + weapons[idx].name.toUpperCase());

        class Enemy {
            constructor(mesh, type, health, speed, color, behavior) {
                this.mesh = mesh;
                this.type = type;
                this.health = health;
                this.maxHealth = health;
                this.speed = speed;
                this.color = color;

        function createEnemy(type = null) {
            if (!gameActive) return;
            let enemyType = type;
            if (!enemyType) {
                const rand = Math.random();
                if (rand < 0.5) enemyType = 'normal';
                else if (rand < 0.7) enemyType = 'fast';
                else if (rand < 0.85) enemyType = 'tank';
                else enemyType = 'dodge';
            }
            let geometry, color, health, speed, behavior;
            switch (enemyType) {
                case 'fast':
                    geometry = new THREE.SphereGeometry(0.4, 24, 24); color = 0xffaa44; health = 1; speed = 1.2; behavior = 'fast'; break;
                case 'tank':
                    geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8); color = 0xaa66ff; health = 3; speed = 0.4; behavior = 'tank'; break;
                case 'dodge':
                    geometry = new THREE.IcosahedronGeometry(0.45, 0); color = 0x44ffaa; health = 1; speed = 0.8; behavior = 'dodge'; break;
                default:
                    geometry = new THREE.SphereGeometry(0.45, 32, 32); color = 0xff6666; health = 1; speed = 0.6; behavior = 'normal';
            }
            const material = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.3, metalness: 0.6 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            const x = (Math.random() - 0.5) * 6.4;
            const y = 0.8 + Math.random() * 3.4;
            const z = -2.5 - Math.random() * 3.5;
            mesh.position.set(x, y, z);
            scene.add(mesh);
            enemies.push(new Enemy(mesh, enemyType, health, speed, color, behavior));
            updateUI();
        }

        function startWave() {
            let baseCount = 5 + Math.floor(wave / 2);
            waveEnemiesRemaining = Math.min(baseCount, 30);
            for (let i = 0; i < Math.min(5, waveEnemiesRemaining); i++) createEnemy();
            const hue = (wave * 0.1) % 1;
            const bgColor = new THREE.Color().setHSL(hue, 0.7, 0.08);
            scene.background = bgColor;
            if (scene.fog) scene.fog.color = bgColor;
        }

        function checkWaveComplete() {
            if (enemies.length === 0 && waveEnemiesRemaining <= 0 && gameActive) {
                wave++;
                document.getElementById('waveValue').innerText = wave;
                startWave();
                const w = weapons[currentWeapon];
                w.currentAmmo = Math.min(w.maxAmmo, w.currentAmmo + 15);
                updateAmmoDisplay();

                showFloatingText(`+15 патронов!`);

        function addScore(points) {
            let added = Math.floor(points * combo * activeBonuses.scoreMultiplier);
            score += added;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('shooterHighScore', highScore);
                document.getElementById('recordValue').innerText = highScore;
            }
            updateUI();
            showFloatingText("+" + added);
        }

        function updateCombo(hit) {
            if (hit) {
                comboCounter++;
                combo = 1 + Math.floor(comboCounter / 10);
                if (combo > 10) combo = 10;
            } else {
                comboCounter = 0;
                combo = 1;
            }
            document.getElementById('comboValue').innerText = combo;
        }

        let mouseX = 0, mouseY = 0;
        let lastShotTime = 0;
        let lastEmptyMessageTime = 0;

        function shoot() {
            if (!gameActive || paused) return;
            const w = weapons[currentWeapon];
            if (w.currentAmmo <= 0) {
                const now = Date.now();
                if (now - lastEmptyMessageTime > 800) {
                    lastEmptyMessageTime = now;
                    playSound('empty');
                    const nextIdx = findWeaponWithAmmo();
                    if (nextIdx === -1) {
                        showFloatingText('⚠️ НЕТ ПАТРОНОВ!', true);
                        endGame("Закончились все патроны!");
                    } else {
                        showFloatingText(`⚠️ Нет патронов! Выбери ${weapons[nextIdx].name}`, true);
                    }
                }
                return;
            }
            const now = Date.now();
            const delay = w.delay / activeBonuses.fireRate;
            if (now - lastShotTime < delay) return;
            lastShotTime = now;
            w.currentAmmo--;
            updateAmmoDisplay();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(mouseX, mouseY), camera);
            let hitSomething = false;
            for (let s = 0; s < w.shots; s++) {
                let offsetX = mouseX + (Math.random() - 0.5) * w.spread;
                let offsetY = mouseY + (Math.random() - 0.5) * w.spread;
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(offsetX, offsetY), camera);
                const intersects = ray.intersectObjects(enemies.map(e => e.mesh));
                if (intersects.length) {
                    hitSomething = true;
                    const enemyObj = enemies.find(e => e.mesh === intersects[0].object);
                    if (enemyObj) {
                        enemyObj.health--;
                        if (enemyObj.health <= 0) {
                            const points = (enemyObj.type === 'tank' ? 30 : (enemyObj.type === 'fast' ? 15 : 20));
                            addScore(points);
                            enemiesKilled++;
                            createExplosion(enemyObj.mesh.position, enemyObj.color);
                            scene.remove(enemyObj.mesh);
                            enemies = enemies.filter(e => e !== enemyObj);
                            waveEnemiesRemaining--;
                            updateCombo(true);
                            dropAmmo(enemyObj.mesh.position);
                            checkWaveComplete();
                        } else {
                            updateCombo(true);
                        }
                    }
                }
            }
            if (hitSomething) playSound('hit');
            else { updateCombo(false); playSound('miss'); }
            playSound('shot');
            const cross = document.getElementById('crosshair');
            cross.style.transform = 'translate(-50%, -50%) scale(0.85)';
            setTimeout(() => cross.style.transform = 'translate(-50%, -50%) scale(1)', 80);
        }

        function createExplosion(pos, color) {
            const count = 30;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 0.5;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({ color: color, size: 0.1, blending: THREE.AdditiveBlending });
            const points = new THREE.Points(geo, mat);
            points.position.copy(pos);
            scene.add(points);
            setTimeout(() => scene.remove(points), 300);
        }

        let animTime = 0;
        let lastTimestamp = 0;
        let fps = 60;
        let quality = 'high';

        function checkPerformance() {
            const now = performance.now();
            const delta = now - lastTimestamp;
            lastTimestamp = now;
            const currentFps = 1000 / delta;
            fps = fps * 0.9 + currentFps * 0.1;
            if (fps < 40 && quality !== 'low') {
                quality = 'low';
                renderer.shadowMap.enabled = false;
                particleMat.size = 0.04;
                playerParticleMat.size = 0.03;
            } else if (fps > 55 && quality !== 'high') {
                quality = 'high';
                renderer.shadowMap.enabled = true;
                particleMat.size = 0.08;
                playerParticleMat.size = 0.05;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (paused || !gameActive) { renderer.render(scene, camera); return; }
            checkPerformance();
            animTime += 0.016;

            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                const speed = e.speed * (activeBonuses.slowMotion === 1 ? 1 : 0.5);
                e.mesh.position.x += (Math.sin(animTime * 0.8 + e.floatOffset) * 0.02) * speed;
                e.mesh.position.y += (Math.cos(animTime * 0.6 + e.floatOffset) * 0.02) * speed;
                e.mesh.position.z += (Math.sin(animTime * 0.5 + e.floatOffset) * 0.015) * speed;
                e.mesh.position.x = Math.min(Math.max(e.mesh.position.x, -3.5), 3.5);
                e.mesh.position.y = Math.min(Math.max(e.mesh.position.y, 0.5), 4.5);
                e.mesh.position.z = Math.min(Math.max(e.mesh.position.z, -6.5), -2.5);
                e.mesh.rotation.x += e.rotateSpeed;
                e.mesh.rotation.y += e.rotateSpeed * 1.2;
            }

            for (let i = 0; i < ammoPacks.length; i++) {
                const a = ammoPacks[i];
                a.mesh.rotation.x += 0.03;
                a.mesh.rotation.y += 0.05;
                a.life -= 0.03;
                if (a.life <= 0) { scene.remove(a.mesh); ammoPacks.splice(i, 1); i--; }
                else {
                    const distToCamera = Math.abs(a.mesh.position.z - camera.position.z);
                    if (distToCamera < 1.5) { addAmmo(a.amount); scene.remove(a.mesh); ammoPacks.splice(i, 1); i--; }
                }
            }

            if (gameActive && enemies.length < 8 && waveEnemiesRemaining > 0) createEnemy();

            playerParticles.rotation.y += 0.02;
            particles.rotation.y += 0.001;

            camera.position.x = 0;
            camera.position.y = 1.6;
            camera.lookAt(0, 1.6, -5);

            renderer.render(scene, camera);
        }

        updateCrosshairPos(window.innerWidth / 2, window.innerHeight / 2);
        updateWeaponSwitcherUI();
        showMenu();
        try { document.getElementById('verTag').textContent = 'v' + VER; } catch(e) {}
        animate();
    </script>
</body>

</html>
