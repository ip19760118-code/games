<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Игровой центр</title>
  <meta property="og:title" content="Игровой центр">
  <meta property="og:description" content="Мини-игры в Telegram, VK и MAX: выбирай, играй и делись рекордами с друзьями.">
  <meta property="og:image" content="https://ip19760118-code.github.io/games/icon-512.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#070b16">
  <meta name="color-scheme" content="light dark">
  <script src="./js/platform.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZD8QE6XKTR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZD8QE6XKTR', {'page_title': document.title, 'page_path': location.pathname});
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; overscroll-behavior: none; overscroll-behavior-y: none; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #070b16; font-family: system-ui, -apple-system, sans-serif; touch-action: pan-y; user-select: none; -webkit-user-select: none; overscroll-behavior: none; overscroll-behavior-y: none; }
    .wrap { width: 100vw; height: 100vh; display: flex; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    .panel { margin: auto; width: 100%; max-width: min(420px, 100%); padding: 22px 16px; border-radius: 24px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28); text-align: center; color: #eaf0ff; flex-shrink: 0; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 7vw, 32px); color: #7cffc4; }
    .hub-subtitle { margin: 0 0 8px; color: #7cffc4; font-size: clamp(13px, 3.6vw, 15px); font-weight: 700; }
    .hub-desc { margin: 0 0 16px; color: #a8b4d8; font-size: clamp(12px, 3.4vw, 14px); line-height: 1.45; }
    .game-btn { width: 100%; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; background: rgba(255, 255, 255, 0.06); color: #eaf0ff; padding: 12px; margin-bottom: 10px; cursor: pointer; text-align: left; transition: transform 0.08s ease, background 0.15s ease; font-family: inherit; font-size: inherit; touch-action: manipulation; min-width: 0; }
    .game-btn:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.10); }
    .game-btn.disabled { opacity: 0.45; cursor: default; }
    .game-emoji { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; background: rgba(124, 255, 196, 0.12); border: 1px solid rgba(124, 255, 196, 0.18); flex-shrink: 0; }
    .game-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
    .game-text b { font-size: clamp(15px, 4.2vw, 17px); color: #ffffff; }
    .game-text small { font-size: clamp(11px, 3.2vw, 13px); color: #a8b4d8; line-height: 1.25; }
    .hub-foot { margin: 12px 0 0; color: #6b7699; font-size: 12px; }
    .hub-ver { margin: 6px 0 0; color: #4d5670; font-size: 10px; font-family: monospace; letter-spacing: 1px; }
    .hub-ver .plat { color: #7cffc4; font-weight: 700; }
    .tag-online { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 10px; background: rgba(124, 255, 196, 0.15); border: 1px solid rgba(124, 255, 196, 0.4); color: #7cffc4; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>🎮 Игровой центр</h1>
      <p class="hub-subtitle">Мини-игры в Telegram, VK и MAX</p>
      <p class="hub-desc">Аркады, головоломки, классика и онлайн‑партии — всё в одном центре. Работает в трёх мессенджерах и в браузере: без установки, нажми и играй. Новые игры добавляются регулярно.</p>

      <button class="game-btn" id="trendCatchBtn"><span class="game-emoji">📈</span><span class="game-text"><b>Trend Catch</b><small>Лови тренды интернета и избегай инфошум</small></span></button>
      <button class="game-btn" id="lightsOutBtn"><span class="game-emoji">💡</span><span class="game-text"><b>Выключи Свет</b><small>Логическая головоломка: выключи всё поле</small></span></button>
      <button class="game-btn" id="arkanoidBtn"><span class="game-emoji">🧱</span><span class="game-text"><b>Neon Arkanoid 3D</b><small>Классический арканоид с бонусами и ловушками</small></span></button>
      <button class="game-btn" id="dominoBtn"><span class="game-emoji">🧩</span><span class="game-text"><b>Домино <span class="tag-online">ONLINE</span></b><small>Классика против бота или онлайн до 4 игроков</small></span></button>
      <button class="game-btn" id="shooterBtn"><span class="game-emoji">🔫</span><span class="game-text"><b>3D Shooter</b><small>3D-шутер с волнами врагов и тремя видами оружия</small></span></button>
      <button class="game-btn" id="fruitSamuraiBtn"><span class="game-emoji">🍉</span><span class="game-text"><b>Фруктовый самурай</b><small>Режь фрукты на лету и уворачивайся от бомб</small></span></button>
      <button class="game-btn" id="chessBtn"><span class="game-emoji">♟️</span><span class="game-text"><b>Шахматы <span class="tag-online">ONLINE</span></b><small>Полные правила: против бота или друга онлайн</small></span></button>
      <button class="game-btn" id="durakBtn"><span class="game-emoji">🃏</span><span class="game-text"><b>Дурак <span class="tag-online">ONLINE</span></b><small>Подкидной и переводной: боты или онлайн до 4</small></span></button>
      <button class="game-btn" id="nardyBtn"><span class="game-emoji">🎲</span><span class="game-text"><b>Нарды <span class="tag-online">ONLINE</span></b><small>Классические длинные: бот или онлайн вдвоём</small></span></button>
      <button class="game-btn" id="shashkiBtn"><span class="game-emoji">⚫</span><span class="game-text"><b>Шашки <span class="tag-online">ONLINE</span></b><small>Русские шашки: бот или онлайн вдвоём</small></span></button>
      <button class="game-btn" id="minesBtn"><span class="game-emoji">💣</span><span class="game-text"><b>Сапёр</b><small>3 жизни, 3 уровня, скины, очки за жизни</small></span></button>
      <button class="game-btn" id="crystalsBtn"><span class="game-emoji">💎</span><span class="game-text"><b>Кристаллы</b><small>Match‑3: бонусы, молнии, котики, корзины, 4 режима</small></span></button>
      <button class="game-btn" id="solitaireBtn"><span class="game-emoji">♠️</span><span class="game-text"><b>Косынка</b><small>Классический пасьянс: перетаскивание, подсказки, скины</small></span></button>
      <button class="game-btn" id="seabattleBtn"><span class="game-emoji">🚢</span><span class="game-text"><b>Морской бой <span class="tag-online">ONLINE</span></b><small>1 игрок vs ИИ или онлайн‑дуэль по коду комнаты</small></span></button>
      <button class="game-btn" id="mahjongBtn"><span class="game-emoji">🀄</span><span class="game-text"><b>Маджонг</b><small>Пасьянс: 72/120/180 плиток, наборы, подсказки, отмена</small></span></button>
      <button class="game-btn" id="tetrisBtn"><span class="game-emoji">🧱</span><span class="game-text"><b>Тетрис</b><small>Классика: 6 уровней, ghost, hold, wall kicks, рекорды</small></span></button>
      <button class="game-btn disabled" disabled><span class="game-emoji">🚧</span><span class="game-text"><b>Скоро</b><small>Здесь появится новая игра</small></span></button>

      <p class="hub-foot">Новые игры появляются здесь регулярно</p>
      <p class="hub-ver" id="hubVer">hub v3.20 · <span class="plat" id="platTag">web</span></p>
    </div>
  </div>
  <script>
    const HUB_VER = '3.20';

    Platform.init({
      bg: '#070b16',
      back: function() { Platform.close(); }
    });

    try { document.getElementById('platTag').textContent = Platform.name; } catch(e) {}

    function trackEvent(name, params){
      params = params || {};
      params.platform = Platform.name;
      try { if (typeof gtag === 'function') gtag('event', name, params); } catch (e) {}
    }

    (function(){
      try {
        const k = 'hub_session_tracked';
        if (!sessionStorage.getItem(k)) {
          sessionStorage.setItem(k, '1');
          trackEvent('hub_open', { source: Platform.name, ver: HUB_VER });
        }
      } catch (e) {}
    })();

    function openGame(url, gameName) {
      trackEvent('hub_game_click', { game_name: gameName });
      try { Platform.haptic('light'); } catch (e) {}
      const sep = url.indexOf('?') >= 0 ? '&' : '?';
      const target = url + sep + 'plat=' + Platform.name;
      let abs = target;
      try { abs = new URL(target, location.href).href; } catch (e) {}

      if (Platform.name === 'max') {
        try { Platform.toast('Открываю игру…'); } catch (e) {}
        try {
          if (window.WebApp && window.WebApp.openLink) { window.WebApp.openLink(abs); return; }
        } catch (e) {}
        try { window.open(abs, '_blank'); return; } catch (e) {}
        location.href = target;
        return;
      }
      location.href = target;
    }

    (function prefetchTop(){
      try {
        if (navigator.connection && navigator.connection.saveData) return;
        setTimeout(function(){
          ['chess','seabattle','durak','tetris'].forEach(function(g){
            var l = document.createElement('link');
            l.rel = 'prefetch';
            l.href = './' + g + '/';
            document.head.appendChild(l);
          });
        }, 1500);
      } catch (e) {}
    })();

    const GAME_MAP = {
      'trend_catch': './trend-catch/',
      'trend': './trend-catch/',
      'lights_out': './lights-out/',
      'lights': './lights-out/',
      'arkanoid': './arkanoid/',
      'domino': './domino/',
      'shooter': './shooter/',
      'fruit_samurai': './fruit-samurai/',
      'samurai': './fruit-samurai/',
      'chess': './chess/',
      'durak': './durak/',
      'nardy': './nardy/',
      'shashki': './shashki/',
      'minesweeper': './minesweeper/',
      'mines': './minesweeper/',
      'crystals': './crystals/',
      'solitaire': './solitaire/',
      'seabattle': './seabattle/',
      'mahjong': './mahjong/',
      'tetris': './tetris/',
      'tetris_classic': './tetris/'
    };

    document.getElementById('trendCatchBtn').addEventListener('click', () => openGame('./trend-catch/', 'trend_catch'));
    document.getElementById('lightsOutBtn').addEventListener('click', () => openGame('./lights-out/', 'lights_out'));
    document.getElementById('arkanoidBtn').addEventListener('click', () => openGame('./arkanoid/', 'arkanoid'));
    document.getElementById('dominoBtn').addEventListener('click', () => openGame('./domino/', 'domino'));
    document.getElementById('shooterBtn').addEventListener('click', () => openGame('./shooter/', 'shooter'));
    document.getElementById('fruitSamuraiBtn').addEventListener('click', () => openGame('./fruit-samurai/', 'fruit_samurai'));
    document.getElementById('chessBtn').addEventListener('click', () => openGame('./chess/', 'chess'));
    document.getElementById('durakBtn').addEventListener('click', () => openGame('./durak/', 'durak'));
    document.getElementById('nardyBtn').addEventListener('click', () => openGame('./nardy/', 'nardy'));
    document.getElementById('shashkiBtn').addEventListener('click', () => openGame('./shashki/', 'shashki'));
    document.getElementById('minesBtn').addEventListener('click', () => openGame('./minesweeper/', 'minesweeper'));
    document.getElementById('crystalsBtn').addEventListener('click', () => openGame('./crystals/', 'crystals'));
    document.getElementById('solitaireBtn').addEventListener('click', () => openGame('./solitaire/', 'solitaire'));
    document.getElementById('seabattleBtn').addEventListener('click', () => openGame('./seabattle/', 'seabattle'));
    document.getElementById('mahjongBtn').addEventListener('click', () => openGame('./mahjong/', 'mahjong'));
    document.getElementById('tetrisBtn').addEventListener('click', () => openGame('./tetris/', 'tetris'));

    document.getElementById('hubVer').innerHTML = 'hub v' + HUB_VER + ' · <span class="plat">' + Platform.name + '</span>';

    (function handleDeepLink() {
      try {
        const u = new URL(location.href);
        const g = (u.searchParams.get('game') || '').toLowerCase();
        if (g && GAME_MAP[g]) {
          setTimeout(function() {
            trackEvent('hub_deeplink', { game: g });
            openGame(GAME_MAP[g], g);
          }, 150);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
